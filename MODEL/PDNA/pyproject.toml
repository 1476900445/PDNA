[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdna-reproduction"
version = "0.1.0"
description = "Engineering reproduction of the PDNA automated negotiation dialogue framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=4.40",
  "sentencepiece>=0.2",
]

[project.optional-dependencies]
negmas = ["negmas>=0.10"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["pdna*"]

[tool.ruff]
line-length = 100
target-version = "py310"

